<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="https://cdn.plot.ly/plotly-2.29.1.min.js" charset="utf-8"></script>
		<style>
			body {
				margin: 0px;
				padding: 0px;
			}

			.plot {
				display: inline-block;
				width: 45vw;
				height: 70vh;
			}
		</style>
	</head>
	<body>
		<div id="indicators" class="plot"></div>
		<div id="criteria" class="plot"></div>
		<script type="text/javascript">
const data = [{"iteration":0,"indicators":{"mode_share:car":0.6103890940073843,"mode_share:car_passenger":0.15777335984095428,"mode_share:pt":0.10380005680204488,"mode_share:bicycle":0.013030389094007385,"mode_share:walk":0.1150071002556092,"mode_share:drt":0.0},"criteria":{"mode_share:car":"NaN","mode_share:car_passenger":"NaN","mode_share:pt":"NaN","mode_share:bicycle":"NaN","mode_share:walk":"NaN","mode_share:drt":"NaN"}},{"iteration":1,"indicators":{"mode_share:car":0.6073193418987268,"mode_share:car_passenger":0.15561885936864137,"mode_share:pt":0.10179640718562874,"mode_share:bicycle":0.013627114702633569,"mode_share:walk":0.11447590256380442,"mode_share:drt":0.007162374280565083},"criteria":{"mode_share:car":"NaN","mode_share:car_passenger":"NaN","mode_share:pt":"NaN","mode_share:bicycle":"NaN","mode_share:walk":"NaN","mode_share:drt":"NaN"}},{"iteration":1,"indicators":{"mode_share:car":0.6035003987193372,"mode_share:car_passenger":0.15360216141587021,"mode_share:pt":0.10027493781168545,"mode_share:bicycle":0.014609790642592747,"mode_share:walk":0.11381354217498423,"mode_share:drt":0.014199169235530058},"criteria":{"mode_share:car":"NaN","mode_share:car_passenger":"NaN","mode_share:pt":"NaN","mode_share:bicycle":"NaN","mode_share:walk":"NaN","mode_share:drt":"NaN"}}];
		
			const iterations = []
			const indicators = {}
			const criteria = {}

			data.forEach(item => {
				iterations.push(item.iteration)

				for (const indicator in item.indicators) {
					if (indicators[indicator] == undefined) {
						indicators[indicator] = []
					}

					indicators[indicator].push(item.indicators[indicator])
				}

				for (const criterion in item.criteria) {
					if (criteria[criterion] == undefined) {
						criteria[criterion] = []
					}

					criteria[criterion].push(item.criteria[criterion])
				}
			})

			const plotIndicators = []
			const plotCriteria = []

			for (const indicator in indicators) {
				plotIndicators.push({
					x: iterations, y: indicators[indicator], name: indicator
				})
			}

			for (const criterion in criteria) {
				plotCriteria.push({
					x: iterations, y: criteria[criterion], name: criterion
				})
			}

			const indicatorsDiv = document.getElementById("indicators")
			Plotly.newPlot(indicatorsDiv, plotIndicators, { 
				title: "Termination indicators",
				xaxis: { title: "Iteration" },
				yaxis: { title: "Value" } })
			
			const criteriaDiv = document.getElementById("criteria")
			Plotly.newPlot(criteriaDiv, plotCriteria, { 
				title: "Termination criteria",
				xaxis: { title: "Iteration" },
				yaxis: { title: "Value" } })
		</script>
	</body>
</html>
